{% extends 'base.html' %}

{% block title %}Delete Project | DevFolio{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <div class="form-box">
            <h1>Delete Project</h1>
            <p>Are you sure you want to delete <strong>{{ project.title }}</strong>?</p>
            <form method="post">
                {% csrf_token %}
                <div class="form-actions">
                    <button type="submit" class="btn">Delete</button>
                    <a href="{% url 'dashboard' %}" class="btn secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
