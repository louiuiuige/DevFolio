{% extends 'base.html' %}

{% block title %}Login | DevFolio CCDI{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <div class="form-box" style="max-width: 480px;">
            <div class="geo-tag"><span class="geo-dot"></span> Authentication</div>
            <h1>Student & Faculty Login</h1>
            <p style="color: var(--bauhaus-muted); margin-bottom: 24px;">Sign in to access your dashboard, submit systems, and review capstones.</p>
            
            <form method="post">
                {% csrf_token %}
                <div class="form-field">
                    <label for="username">Username</label>
                    <input type="text" name="username" id="username" placeholder="Enter your username" required autofocus>
                </div>
                <div class="form-field">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" placeholder="Enter your password" required>
                </div>
                <div class="form-actions" style="margin-top: 24px;">
                    <button type="submit" class="btn" style="width: 100%;">Sign In &rarr;</button>
                </div>
            </form>
            <div style="margin-top: 24px; padding-top: 18px; border-top: 1px dashed var(--bauhaus-border-light); text-align: center; font-size: 0.94rem;">
                Don't have an account yet? <a href="{% url 'register' %}" style="font-weight: 700; color: var(--bauhaus-blue); text-decoration: underline;">Register here.</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
