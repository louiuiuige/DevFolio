{% extends 'base.html' %}

{% block title %}{{ mode }} Project | DevFolio{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <div class="form-box">
            <h1>{{ mode }} Project</h1>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="form-grid">
                    {% for field in form %}
                        <div class="form-field {% if field.name in 'title summary description category technologies featured_image demo_url source_url' %}full{% endif %}">
                            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="alert alert-error">{{ field.errors|join:', ' }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn">Save Project</button>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
